services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      BACKEND_PORT: "8000"
      #DDB_ENDPOINT: http://dynamodb:8000 #leave it blank to use AWS DynamoDB service instead of local DynamoDB
      #AWS_PROFILE: my-aws-profile #leave it blank to use default AWS profile, for ec2 instance, you can use IAM role instead of AWS profile

      AWS_DEFAULT_REGION: us-east-1    
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    command: python -m workers.clustering
    volumes:
      - ./backend:/app
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    environment:
      # Same Compose network: http://backend:8000. Frontend-only EC2: set BACKEND_URL
      # in .env to the backend host or ALB (this line passes that value through).
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
  # in case you want to use Mailpit for email testing, uncomment the following lines
