services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      BACKEND_PORT: "8000"
      # Local: set AWS_PROFILE in .env. On EC2 omit the variable so the instance role is used.
      # Never set AWS_PROFILE to an empty string — boto3 treats that as a missing profile.
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      APP_LOG_LEVEL: "INFO"
      PYTHONUNBUFFERED: "1"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ~/.aws:/root/.aws:ro

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      # Same as backend: never interpolate AWS_PROFILE here (empty string breaks boto3).
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      APP_LOG_LEVEL: "INFO"
      PYTHONUNBUFFERED: "1"
    command: python -m workers.clustering
    volumes:
      - ./backend:/app
      - ~/.aws:/root/.aws:ro
    depends_on:
      - backend

  
  frontend:
    build:
      context: ./frontend
    # Do not use env_file: .env — that file holds AWS keys/profile for the API.
    environment:
      APP_ENV: ${APP_ENV:-local}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      # Same Compose network: http://backend:8000. Frontend-only EC2: set BACKEND_URL
      # in .env to the backend host or ALB (this line passes that value through).
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      # Local: values from .env. EC2 (APP_ENV=aws): leave these empty; Streamlit
      # loads retaillen/AUTH_API_URL, retaillen/REDIS_URL, retaillen/REDIS_PASSWORD,
      # retaillen/SESSION_COOKIE_PASSWORD from Secrets Manager.
      AUTH_API_URL: ${AUTH_API_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SESSION_COOKIE_PASSWORD: ${SESSION_COOKIE_PASSWORD:-}
      REMEMBER_ME_DAYS: ${REMEMBER_ME_DAYS:-14}
      TOKEN_TIME: ${TOKEN_TIME:-48}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    volumes:
      - ./frontend:/app
      
  lambda-signin:
    build:
      context: ./backend
      dockerfile: lambda_signin/Dockerfile  
    env_file:
      - .env
    environment:
      AWS_DEFAULT_REGION: us-east-1
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"
    ports:
      - "${LAMBDA_AUTH_PORT:-8502}:8080"
    volumes:
      - ~/.aws:/root/.aws:ro

  # in case you want to use Mailpit for email testing, uncomment the following lines
  #mailpit:
