[theme]
base = "light"
primaryColor = "#111111"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f7f7"
textColor = "#111111"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
address = "0.0.0.0"
port = 8501
# Required when the app is opened via EC2 IP, hostname, or ALB. The default
# CORS/XSRF policy blocks file uploads and any remaining component iframes.
enableCORS = false
enableXsrfProtection = false

maxUploadSize = 25
