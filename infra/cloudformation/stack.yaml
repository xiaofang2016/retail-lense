AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Retail Lense (COMPX527) — documentation of the production layout.
  Live account 817817875692 was provisioned with the AWS CLI. Do not create
  this stack there (duplicate VPC, ALB, S3, DynamoDB, EC2). Application
  deploys stay on GitHub Actions + EICE. No ACM, WAF, RDS, or SSM.

Parameters:
  ProjectName:
    Type: String
    Default: retaillen
  InstanceType:
    Type: String
    Default: t3.micro
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
  IamServerCertificateArn:
    Type: String
    Default: arn:aws:iam::817817875692:server-certificate/cloudfront/retaillen-letsencrypt
    Description: IAM server certificate (ACM is forbidden). Live Let's Encrypt cert expires 2026-11-24.
  OsUser:
    Type: String
    Default: mike
    Description: Linux user for EICE SendSSHPublicKey (GitHub Actions).
  BucketName:
    Type: String
    Default: retaillen-dev

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-vpc

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-igw

  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-rt

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  Subnet1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Sub ${AWS::Region}a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-1a

  Subnet1c:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Sub ${AWS::Region}c
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-1c

  Subnet1d:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Sub ${AWS::Region}d
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-1d

  RtAssoc1a:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet1a
      RouteTableId: !Ref PublicRouteTable

  RtAssoc1c:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet1c
      RouteTableId: !Ref PublicRouteTable

  RtAssoc1d:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet1d
      RouteTableId: !Ref PublicRouteTable

  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB 443 from the internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-alb-sg

  FrontendSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Streamlit 8501 from ALB only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          SourceSecurityGroupId: !Ref AlbSg
          Description: ALB to Streamlit
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-frontend-sg

  BackendSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: FastAPI 8000 from frontend SG only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref FrontendSg
          Description: frontend to FastAPI
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-backend-sg

  RedisSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redis 6379 from frontend SG (colocated on backend EC2)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref FrontendSg
          Description: frontend sessions
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-redis-sg

  EiceSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EICE — OpenTunnel is IAM-authorized; no inbound CIDR
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-eic-sg

  SshSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH 22 from EICE SG only (no 0.0.0.0/0)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref EiceSg
          Description: EICE
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-ssh-sg

  Eice:
    Type: AWS::EC2::InstanceConnectEndpoint
    Properties:
      SubnetId: !Ref Subnet1a
      SecurityGroupIds:
        - !Ref EiceSg
      PreserveClientIp: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-eice

  FrontendRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-frontend-runtime
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: frontend-runtime-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadFrontendRuntimeSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:retaillen/AUTH_API_URL-*
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:retaillen/REDIS_URL-*
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:retaillen/REDIS_PASSWORD-*
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:retaillen/SESSION_COOKIE_PASSWORD-*

  FrontendInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref FrontendRuntimeRole

  BackendRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-backend-runtime
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: retaillen-backend-runtime-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3ReadPublicUploadsResults
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::${BucketName}/public/*
                  - !Sub arn:aws:s3:::${BucketName}/uploads/*
                  - !Sub arn:aws:s3:::${BucketName}/results/*
              - Sid: S3PutUploadsAndResults
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub arn:aws:s3:::${BucketName}/uploads/*
                  - !Sub arn:aws:s3:::${BucketName}/results/*
              - Sid: DynamoDbAppTables
                Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-users
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-users/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-login-history
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-login-history/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-password-reset
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-otps
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-analyses
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-analyses/index/*
              - Sid: SqsAnalysisQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:SendMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt AnalysisQueue.Arn
              - Sid: SnsSmsOtp
                Effect: Allow
                Action: sns:Publish
                Resource: "*"
              - Sid: SnsAnalysisComplete
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref AnalysisCompleteTopic
              - Sid: ReadRuntimeSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:retaillen/jwt-*
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:retaillen/openai-*
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:retaillen/REDIS_URL-*
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:retaillen/REDIS_PASSWORD-*
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:retaillen/SMTP_USER-*
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:retaillen/SMTP_PASSWORD-*

  BackendInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BackendRuntimeRole

  SigninLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-signin-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: signin-lambda-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-signin*
              - Sid: UsersAndLoginHistory
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-users
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-users/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-login-history
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-login-history/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-otps
              - Sid: SmsOtp
                Effect: Allow
                Action: sns:Publish
                Resource: "*"
              - Sid: ReadJwtSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:retaillen/jwt-*

  CompletionLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-analysis-complete-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: analysis-complete-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-analysis-complete*
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-analyses
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AnalysisCompleteTopic
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${BucketName}/results/*

  GithubEiceUser:
    Type: AWS::IAM::User
    Properties:
      UserName: github-eice
      Policies:
        - PolicyName: github-vm-connect-ec2-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribeInstancesForEiceSsh
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: DescribeEiceEndpoint
                Effect: Allow
                Action: ec2:DescribeInstanceConnectEndpoints
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: SendSshPublicKey
                Effect: Allow
                Action: ec2-instance-connect:SendSSHPublicKey
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ec2:osuser: !Ref OsUser
              - Sid: OpenEiceTunnel
                Effect: Allow
                Action: ec2-instance-connect:OpenTunnel
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance-connect-endpoint/${Eice}

  AppBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - CompletionInvokePermission
      - AnalysisQueuePolicy
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt AnalysisQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt CompletionLambda.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: results/
                  - Name: suffix
                    Value: report.json

  AnalysisQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-analysis-queue
      VisibilityTimeout: 300
      MessageRetentionPeriod: 86400

  AnalysisQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AnalysisQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt AnalysisQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:aws:s3:::${BucketName}

  AnalysisCompleteTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${ProjectName}-analysis-complete

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: UsernameIndex
          KeySchema:
            - AttributeName: username
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  LoginHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-login-history
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: ip
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: IpIndex
          KeySchema:
            - AttributeName: ip
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  PasswordResetTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-password-reset
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  OtpsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-otps
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  AnalysesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-analyses
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: analysis_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: analysis_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  SigninLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-signin
      RetentionInDays: 14

  SigninLambda:
    Type: AWS::Lambda::Function
    DependsOn: SigninLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-signin
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt SigninLambdaRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          JWT_SECRET_NAME: retaillen/jwt
          APP_ENV: aws
      Code:
        ZipFile: |
          def handler(event, context):
              return {
                  "statusCode": 501,
                  "headers": {"content-type": "application/json"},
                  "body": '{"detail":"documentation stub; deploy zip via infra/scripts/package_signin_lambda.sh"}',
              }

  SigninUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !Ref SigninLambda

  SigninUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SigninLambda
      Principal: "*"
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: NONE

  CompletionLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-analysis-complete
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt CompletionLambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          DDB_ANALYSES_TABLE: !Ref AnalysesTable
          SNS_ANALYSIS_COMPLETE_TOPIC_ARN: !Ref AnalysisCompleteTopic
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 501, "body": "documentation stub"}

  CompletionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CompletionLambda
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws:s3:::${BucketName}
      SourceAccount: !Ref AWS::AccountId

  Frontend1a:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      SubnetId: !Ref Subnet1a
      IamInstanceProfile: !Ref FrontendInstanceProfile
      SecurityGroupIds:
        - !Ref FrontendSg
        - !Ref SshSg
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-frontend-us-1a

  Frontend1c:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      SubnetId: !Ref Subnet1c
      IamInstanceProfile: !Ref FrontendInstanceProfile
      SecurityGroupIds:
        - !Ref FrontendSg
        - !Ref SshSg
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-frontend-us-1c

  Backend1d:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      SubnetId: !Ref Subnet1d
      IamInstanceProfile: !Ref BackendInstanceProfile
      SecurityGroupIds:
        - !Ref BackendSg
        - !Ref RedisSg
        - !Ref SshSg
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-backend-us-1d

  TargetGroup1a:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-frontend-tg
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8501
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"
      Targets:
        - Id: !Ref Frontend1a
          Port: 8501

  TargetGroup1c:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-frontend-1c
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8501
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"
      Targets:
        - Id: !Ref Frontend1c
          Port: 8501

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${ProjectName}-alb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref AlbSg
      Subnets:
        - !Ref Subnet1a
        - !Ref Subnet1c

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
      Certificates:
        - CertificateArn: !Ref IamServerCertificateArn
      DefaultActions:
        - Type: forward
          ForwardConfig:
            TargetGroups:
              - TargetGroupArn: !Ref TargetGroup1a
                Weight: 50
              - TargetGroupArn: !Ref TargetGroup1c
                Weight: 50
            TargetGroupStickinessConfig:
              Enabled: false

  UnhealthyHostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-frontend-unhealthy
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt Alb.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup1a.TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
  SigninFunctionUrl:
    Value: !GetAtt SigninUrl.FunctionUrl
  EiceId:
    Value: !Ref Eice
  BucketNameOut:
    Value: !Ref AppBucket
  AnalysisQueueUrl:
    Value: !Ref AnalysisQueue
  Frontend1aId:
    Value: !Ref Frontend1a
  Frontend1cId:
    Value: !Ref Frontend1c
  Backend1dId:
