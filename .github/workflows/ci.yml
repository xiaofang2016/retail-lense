name: CI/CD

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Dummy, never-validated credentials: boto3's presigned-URL signing (POST /analyses)
      # needs *some* credentials present to compute a SigV4 signature, even though it never
      # makes a network call. Locally this works silently via ~/.aws/credentials; CI has none.
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_SESSION_TOKEN: testing
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      S3_BUCKET: retail-lense-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall frontend backend

      - name: Auth tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          PYTHONPATH=. pytest tests/

  changes:
    name: Detect deploy targets
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter paths
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: deploying backend and frontend."
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "No previous commit: deploying backend and frontend."
            exit 0
          fi

          files="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"
          echo "Changed files:"
          echo "$files"

          backend=false
          frontend=false
          if echo "$files" | grep -qE '^(backend/|infra/scripts/deploy_ec2_backend\.sh|docker-compose\.yml)'; then
            backend=true
          fi
          if echo "$files" | grep -qE '^(frontend/|infra/scripts/deploy_ec2_frontend\.sh|docker-compose\.yml)'; then
            frontend=true
          fi

          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend}" >> "$GITHUB_OUTPUT"

  deploy-backend:
    name: Deploy backend EC2
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      DEPLOY_BRANCH: dev
      INSTANCE_ID: ${{ secrets.DEPLOY_HOST_BACKEND_US_1D }}
      EICE_ENDPOINT_ID: ${{ secrets.DEPLOY_EICE_ENDPOINT_ID }}
      OS_USER: ${{ secrets.DEPLOY_USER }}
      APP_DIR: /home/mike/retail-lense/retail-lense
    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "${INSTANCE_ID}" ]; then
            echo "DEPLOY_HOST_BACKEND_US_1D must be the backend EC2 instance id (i-...)."
            exit 1
          fi
          if [ -z "${EICE_ENDPOINT_ID}" ]; then
            echo "DEPLOY_EICE_ENDPOINT_ID is required (eice-...)."
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "DEPLOY_AWS_ACCESS_KEY_ID and DEPLOY_AWS_SECRET_ACCESS_KEY are required."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy backend via Instance Connect Endpoint
        timeout-minutes: 20
        run: |
          chmod +x infra/scripts/ci_eice_ssh.sh
          ./infra/scripts/ci_eice_ssh.sh \
            "export APP_DIR=${APP_DIR} DEPLOY_BRANCH=dev; bash ${APP_DIR}/infra/scripts/deploy_ec2_backend.sh"

  deploy-frontend:
    name: Deploy frontend EC2 (${{ matrix.az }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        az: [US_1A, US_1C]
    env:
      AWS_REGION: us-east-1
      DEPLOY_BRANCH: dev
      EICE_ENDPOINT_ID: ${{ secrets.DEPLOY_EICE_ENDPOINT_ID }}
      OS_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Select frontend instance
        run: |
          case "${{ matrix.az }}" in
            US_1A) echo "INSTANCE_ID=${{ secrets.DEPLOY_HOST_FRONTEND_US_1A }}" >> "$GITHUB_ENV" ;;
            US_1C) echo "INSTANCE_ID=${{ secrets.DEPLOY_HOST_FRONTEND_US_1C }}" >> "$GITHUB_ENV" ;;
            *) echo "Unknown AZ ${{ matrix.az }}"; exit 1 ;;
          esac

      - name: Check deploy secrets
        run: |
          echo "Frontend AZ: ${{ matrix.az }}"
          if [ -z "${INSTANCE_ID}" ]; then
            echo "Set DEPLOY_HOST_FRONTEND_US_1A and DEPLOY_HOST_FRONTEND_US_1C to the instance ids (i-...)."
            exit 1
          fi
          if [ -z "${EICE_ENDPOINT_ID}" ]; then
            echo "DEPLOY_EICE_ENDPOINT_ID is required (eice-...)."
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "DEPLOY_AWS_ACCESS_KEY_ID and DEPLOY_AWS_SECRET_ACCESS_KEY are required."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy frontend via Instance Connect Endpoint
        timeout-minutes: 20
        run: |
          chmod +x infra/scripts/ci_eice_ssh.sh
          ./infra/scripts/ci_eice_ssh.sh \
            'export APP_DIR=/home/mike/retail-lense DEPLOY_BRANCH=dev; bash /home/mike/retail-lense/infra/scripts/deploy_ec2_frontend.sh'
