name: CI/CD

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Dummy, never-validated credentials: boto3's presigned-URL signing (POST /analyses)
      # needs *some* credentials present to compute a SigV4 signature, even though it never
      # makes a network call. Locally this works silently via ~/.aws/credentials; CI has none.
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_SESSION_TOKEN: testing
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      S3_BUCKET: retail-lense-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall frontend backend

      - name: Auth tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          PYTHONPATH=. pytest tests/

  deploy-test:
    name: Deploy test (dev)
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest

    env:
      DEPLOY_BRANCH: dev

    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "DEPLOY_HOST is EMPTY"
            exit 1
          else
            echo "DEPLOY_HOST is SET"
          fi

          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then
            echo "DEPLOY_USER is EMPTY"
            exit 1
          else
            echo "DEPLOY_USER is SET"
          fi

          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "DEPLOY_SSH_KEY is EMPTY"
            exit 1
          else
            echo "DEPLOY_SSH_KEY is SET"
          fi

      - name: Deploy test env on Amazon Linux over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          envs: DEPLOY_BRANCH
          command_timeout: 20m

          script: |
            set -euo pipefail

            APP_DIR=/home/mike/retail-lense
            BRANCH=dev

            cd "${APP_DIR}"

            echo "Fetching latest code..."
            git fetch origin

            echo "Resetting to origin/${BRANCH}..."
            git reset --hard "origin/${BRANCH}"

            export APP_DIR
            export DEPLOY_BRANCH="${BRANCH}"

            echo "Running deployment script..."
            bash "${APP_DIR}/infra/scripts/deploy_ec2.sh"